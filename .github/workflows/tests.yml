name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit and API integration tests
        run: python -m unittest discover -s packages/api -p "test_*.py" -v
      - name: Check frontend JavaScript syntax
        run: node --check apps/web/static/app.js
      - name: Validate Docker Compose configuration
        env:
          DEPLOY_DB_PASSWORD: test-db-password
          MYSQL_ROOT_PASSWORD: test-root-password
          DEPLOY_JWT_SECRET: 00000000000000000000000000000000
        run: docker compose config --quiet
